<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ panel_name }}</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:linear-gradient(135deg,#0a0a0a,#1a1a2e,#16213e);min-height:100vh;display:flex;align-items:center;justify-content:center;color:#fff}
.hero{text-align:center;padding:40px}
.hero h1{font-size:48px;margin-bottom:16px;background:linear-gradient(135deg,#00d4ff,#0099cc);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:#888;font-size:18px;margin-bottom:32px}
.hero .badge{display:inline-block;background:rgba(0,212,255,0.15);border:1px solid rgba(0,212,255,0.3);border-radius:20px;padding:8px 20px;color:#00d4ff;font-size:14px}
</style>
</head>
<body>
<div class="hero">
<h1>🛡️ {{ panel_name }}</h1>
<p>Fast & Secure VPN Service</p>
<div class="badge">✅ Online</div>
</div>
</body>
</html>
