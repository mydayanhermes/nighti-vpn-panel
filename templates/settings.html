<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ panel_name }} - Settings</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0a;--card:rgba(255,255,255,0.05);--border:rgba(255,255,255,0.1);--accent:#00d4ff;--green:#00e676;--red:#ff5252}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:#fff;min-height:100vh}
.navbar{background:rgba(0,0,0,0.5);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;justify-content:space-between;align-items:center;backdrop-filter:blur(10px);position:sticky;top:0;z-index:100}
.navbar h2{font-size:18px;color:var(--accent)}
.navbar .links{display:flex;gap:16px;align-items:center}
.navbar a{color:#aaa;text-decoration:none;font-size:14px;transition:0.2s}
.navbar a:hover,.navbar a.active{color:var(--accent)}
.container{max-width:800px;margin:0 auto;padding:20px}
.section{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:24px}
.section h3{margin-bottom:16px;color:#ccc;font-size:16px}
.form-group{margin-bottom:16px}
.form-group label{display:block;margin-bottom:6px;color:#888;font-size:13px}
.form-group input{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;background:rgba(255,255,255,0.05);color:#fff;font-size:14px;outline:none}
.form-group input:focus{border-color:var(--accent)}
.btn{padding:10px 24px;border:none;border-radius:8px;background:var(--accent);color:#000;font-size:14px;font-weight:600;cursor:pointer;transition:0.2s}
.btn:hover{transform:translateY(-1px)}
</style>
</head>
<body>
<nav class="navbar">
<h2>🛡️ {{ panel_name }}</h2>
<div class="links">
<a href="/">Dashboard</a>
<a href="/settings" class="active">Settings</a>
<a href="/logs">Logs</a>
<a href="/logout">Logout</a>
</div>
</nav>
<div class="container">
<div class="section">
<h3>⚙️ Server Settings</h3>
<form method="POST">
<div class="form-group">
<label>Server IP (for configs)</label>
<input type="text" name="server_ip" value="{{ settings.get('server_ip','') }}" placeholder="1.2.3.4">
</div>
<div class="form-group">
<label>Panel Name</label>
<input type="text" name="panel_name" value="{{ settings.get('panel_name','') }}" placeholder="NighTi VPN Panel">
</div>
<div class="form-group">
<label>VLESS WebSocket Path</label>
<input type="text" name="vless_path" value="{{ settings.get('vless_path','/ws') }}" placeholder="/ws">
</div>
<div class="form-group">
<label>SNI / Domain (for TLS)</label>
<input type="text" name="vless_sni" value="{{ settings.get('vless_sni','') }}" placeholder="your-domain.com">
</div>
<div class="form-group">
<label>Subscription Prefix</label>
<input type="text" name="sub_prefix" value="{{ settings.get('sub_prefix','sub') }}" placeholder="sub">
</div>
<button type="submit" class="btn">💾 Save Settings</button>
</form>
</div>
</div>
</body>
</html>
