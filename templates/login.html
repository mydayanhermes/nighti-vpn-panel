<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ panel_name }} - Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:linear-gradient(135deg,#0a0a0a 0%,#1a1a2e 50%,#16213e 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;color:#fff}
.login-box{background:rgba(255,255,255,0.05);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:40px;width:380px;max-width:90%}
.login-box h1{text-align:center;margin-bottom:8px;font-size:24px;color:#00d4ff}
.login-box .subtitle{text-align:center;color:#888;margin-bottom:30px;font-size:14px}
.form-group{margin-bottom:20px}
.form-group label{display:block;margin-bottom:8px;color:#aaa;font-size:13px}
.form-group input{width:100%;padding:12px 16px;border:1px solid rgba(255,255,255,0.15);border-radius:10px;background:rgba(255,255,255,0.05);color:#fff;font-size:15px;outline:none;transition:0.3s}
.form-group input:focus{border-color:#00d4ff;box-shadow:0 0 15px rgba(0,212,255,0.2)}
.btn{width:100%;padding:14px;border:none;border-radius:10px;background:linear-gradient(135deg,#00d4ff,#0099cc);color:#fff;font-size:16px;font-weight:600;cursor:pointer;transition:0.3s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,212,255,0.3)}
.error{background:rgba(255,50,50,0.15);border:1px solid rgba(255,50,50,0.3);border-radius:10px;padding:12px;text-align:center;margin-bottom:20px;color:#ff6b6b;font-size:14px}
</style>
</head>
<body>
<div class="login-box">
<h1>🔐 {{ panel_name }}</h1>
<p class="subtitle">VPN Management Panel</p>
{% if error %}
<div class="error">{{ error }}</div>
{% endif %}
<form method="POST">
<div class="form-group">
<label>Username</label>
<input type="text" name="username" placeholder="admin" required autofocus>
</div>
<div class="form-group">
<label>Password</label>
<input type="password" name="password" placeholder="••••••" required>
</div>
<button type="submit" class="btn">ورود</button>
</form>
</div>
</body>
</html>
